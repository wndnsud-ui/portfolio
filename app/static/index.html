<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DecisionFlow</title>
  <link rel="stylesheet" href="/static/styles.css?v=7">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#dashboard" aria-label="DecisionFlow 홈"><span>DF</span>DecisionFlow</a>
    <nav aria-label="주 메뉴">
      <button class="nav-item active" data-view="dashboard"><span>▦</span>대시보드</button>
      <button class="nav-item" data-view="projects"><span>□</span>프로젝트</button>
      <button class="nav-item" data-view="meetings"><span>◫</span>회의</button>
      <button class="nav-item" data-view="actions"><span>✓</span>Action Items</button>
      <button class="nav-item" data-view="decisions"><span>◇</span>결정사항</button>
    </nav>
    <div class="sidebar-foot"><span class="status-dot"></span>Local workspace</div>
  </aside>

  <main>
    <header class="topbar">
      <div><p class="eyebrow">WORKSPACE</p><h1 id="page-title">대시보드</h1></div>
      <div class="top-actions">
        <button class="secondary" id="refresh-btn">새로고침</button>
        <button class="audio-button" id="global-audio-btn">음성 회의</button>
        <button class="primary" id="create-btn">+ 새 프로젝트</button>
      </div>
    </header>

    <section id="dashboard-view" class="view active">
      <div class="metrics" id="metrics"></div>
      <div class="dashboard-grid">
        <section class="panel wide">
          <div class="section-head"><div><p class="eyebrow">MEETINGS</p><h2>최근 회의</h2></div><button class="text-button" data-go="meetings">전체 보기 →</button></div>
          <div id="recent-meetings" class="list"></div>
        </section>
        <section class="panel">
          <div class="section-head"><div><p class="eyebrow">RISK WATCH</p><h2>주의할 업무</h2></div></div>
          <div id="risk-items" class="list compact"></div>
        </section>
      </div>
      <section class="panel">
        <div class="section-head"><div><p class="eyebrow">LATEST</p><h2>최근 결정사항</h2></div><button class="text-button" data-go="decisions">전체 보기 →</button></div>
        <div id="recent-decisions" class="decision-grid"></div>
      </section>
    </section>

    <section id="projects-view" class="view">
      <div class="section-head page-section-head"><div><p class="eyebrow">PROJECTS</p><h2>프로젝트 목록</h2></div></div>
      <div id="projects-list" class="project-grid"></div>
    </section>

    <section id="meetings-view" class="view">
      <div class="filters"><button class="audio-button" id="audio-meeting-btn">음성으로 회의 등록</button><input id="meeting-search" type="search" placeholder="회의 제목이나 회의록 검색"><select id="meeting-project-filter"><option value="">모든 프로젝트</option></select></div>
      <section class="panel"><div id="meetings-list" class="list"></div></section>
    </section>

    <section id="actions-view" class="view">
      <div class="filters"><select id="action-project-filter"><option value="">모든 프로젝트</option></select><select id="action-status-filter"><option value="">모든 상태</option><option value="todo">할 일</option><option value="in_progress">진행 중</option><option value="done">완료</option><option value="cancelled">취소</option></select><select id="action-risk-filter"><option value="">모든 위험도</option><option value="high">높음</option><option value="medium">보통</option><option value="low">낮음</option></select></div>
      <section class="panel table-wrap"><table><thead><tr><th>업무</th><th>프로젝트</th><th>담당자</th><th>기한</th><th>상태</th><th>위험</th><th class="actions-col">관리</th></tr></thead><tbody id="actions-list"></tbody></table></section>
    </section>

    <section id="decisions-view" class="view">
      <div class="filters"><select id="decision-project-filter"><option value="">프로젝트 선택</option></select></div>
      <div id="decisions-list" class="decision-grid"></div>
    </section>
  </main>

  <dialog id="create-dialog">
    <form id="create-form" method="dialog">
      <div class="dialog-head"><div><p class="eyebrow">CREATE</p><h2 id="dialog-title">새 프로젝트</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="닫기">×</button></div>
      <div id="form-fields"></div>
      <p class="form-error" id="form-error"></p>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancel-dialog">취소</button><button type="submit" class="primary">저장</button></div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="/static/app.js?v=7"></script>
</body>
</html>
