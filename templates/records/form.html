{% extends 'base.html' %}{% block title %}{{ 'Edit' if record else 'New' }} Record — HY ARCHIVE{% endblock %}{% block content %}<main class="page narrow"><p class="eyebrow">RECORDS / {{ 'EDIT' if record else 'WRITE' }}</p><h1 class="page-title">{{ 'Edit' if record else 'Write a new' }}<br><em>record.</em></h1><form method="post" class="record-form"><label>Title *<input name="title" required value="{{ record.title if record else '' }}"></label><label>Category<select name="category">{% for cat in ['AI / ML','DATA','DEVELOPMENT','PROJECT','LECTURE','CERTIFICATION','WORK','THINKING'] %}<option {% if record and record.category == cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}</select></label><label>Summary<textarea name="summary" rows="2">{{ record.summary if record else '' }}</textarea></label><label>Tags<input name="tags" placeholder="data, validation, learning" value="{{ record.tags if record else '' }}"></label><label>Content *<textarea name="content" rows="16" required placeholder="Markdown으로 작성하세요.">{{ record.content if record else '' }}</textarea></label><div class="form-grid"><label>Source Type<select name="source_type"><option>study</option><option>lecture</option><option>project</option><option>experiment</option><option>work</option><option>thought</option></select></label><label>Source URL<input name="source_url" value="{{ record.source_url if record else '' }}"></label></div><label class="check"><input type="checkbox" name="is_featured" {% if record and record.is_featured %}checked{% endif %}> Featured recommendation</label><label class="check"><input type="checkbox" name="is_pinned" {% if record and record.is_pinned %}checked{% endif %}> Pin to top</label><button class="button dark" type="submit">SAVE RECORD ↗</button></form></main>{% endblock %}
