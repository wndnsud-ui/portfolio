# 주 1회 Supabase DB 백업.
# 저장소가 공개이므로 덤프를 암호화(gpg, BACKUP_PASSPHRASE)한 뒤 Actions 아티팩트로 90일 보관한다.
# 필요한 저장소 Secrets: DATABASE_URL(Supabase Session pooler 주소), BACKUP_PASSPHRASE
# 복원: gpg -d backup.sql.gz.gpg | gunzip | psql "$빈_DB_주소"
name: weekly-db-backup

on:
  schedule:
    - cron: "0 18 * * 0"   # 매주 월요일 03:00 KST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          file="hy-archive-$(date -u +%Y%m%d).sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges --schema=public | gzip > "$file"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "$file.gpg" "$file"
          rm "$file"
          ls -lh "$file.gpg"
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: "*.sql.gz.gpg"
          retention-days: 90
